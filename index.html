<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Medição de Ruído e Vídeo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; font-size: 1.2rem; }
    label { font-weight: bold; display: block; margin-top: 12px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #999; }
    .hidden { display: none; }
    .btn-whatsapp { display: block; text-align: center; background: #25D366; color: white; text-decoration: none; padding: 12px; border-radius: 4px; font-weight: bold; margin-top: 15px; }
    .btn-voltar { background: #6c757d; margin-top: 10px; }
    .aviso-copia { font-size: 0.85rem; color: #d9534f; margin-top: 8px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="card" id="formCard">
  <h2>🚨 Registro de Medição de Ruído e Vídeo</h2>
  <form id="rondaForm">
    <label>Data da Medição *</label>
    <input type="date" id="dataMedicao" required>

    <label>Endereço Completo (Rua, Nº, Bairro) *</label>
    <input type="text" id="endereco" placeholder="Ex: Av. Jose Caballero, 134 - Centro" required>

    <label>Nome do Estabelecimento / Alvo *</label>
    <input type="text" id="estabelecimento" placeholder="Ex: Padaria 4 Irmãos" required>

    <label>Processo / RIR / AIA (se houver)</label>
    <input type="text" id="processo" placeholder="Ex: 20702">

    <label>Fonte Sonora Detalhada *</label>
    <input type="text" id="fonteSonora" placeholder="Ex: caixas de som, música ao vivo" required>

    <label>Vídeo ou Mídia Principal</label>
    <input type="file" id="videoFile" accept="video/*,image/*">

    <label>Foto Adicional 1</label>
    <input type="file" id="foto1File" accept="image/*">

    <label>Foto Adicional 2</label>
    <input type="file" id="foto2File" accept="image/*">

    <button type="submit" id="btnSubmit">Enviar e Gerar WhatsApp</button>
  </form>
</div>

<div class="card hidden" id="successCard">
  <h2>✅ Registro Salvo com Sucesso!</h2>
  <p>Os arquivos foram enviados para a pasta <b>Midia_da_Medicao</b> e gravados na planilha.</p>
  <a id="whatsappLink" href="#" target="_blank" class="btn-whatsapp">📲 Abrir Grupo do WhatsApp</a>
  <div class="aviso-copia">📋 O texto do relatório foi copiado! Basta colar (Ctrl+V) no grupo.</div>
  <button type="button" class="btn-voltar" id="btnVoltar">🔄 Novo Registro / Voltar</button>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiD0qTM_RLPfuuB1JeyGkxI4tf9tV7kC_JziahSBP-prB5h2sH0-tTfodI5FUb3i8/exec";
  let textoMensagemGlobal = "";

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  const form = document.getElementById('rondaForm');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = "Carregando mídias e salvando...";

    async function processFile(inputId) {
      const input = document.getElementById(inputId);
      if (input.files.length > 0) {
        const file = input.files[0];
        return {
          name: file.name,
          mimeType: file.type,
          data: await fileToBase64(file)
        };
      }
      return null;
    }

    const payload = {
      dataMedicao: document.getElementById('dataMedicao').value,
      endereco: document.getElementById('endereco').value,
      estabelecimento: document.getElementById('estabelecimento').value,
      processo: document.getElementById('processo').value,
      fonteSonora: document.getElementById('fonteSonora').value,
      videoFile: await processFile('videoFile'),
      foto1File: await processFile('foto1File'),
      foto2File: await processFile('foto2File')
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === 'success') {
        document.getElementById('formCard').classList.add('hidden');
        document.getElementById('whatsappLink').href = result.linkWhatsApp; 
        
        textoMensagemGlobal = `📱 *Novo Registro de Medição de Ruído e Vídeo*\n\n` +
                              `📅 *Data da Medição:* ${payload.dataMedicao}\n` +
                              `📍 *Endereço:* ${payload.endereco}\n` +
                              `🏢 *Alvo:* ${payload.estabelecimento}\n` +
                              `📋 *Processo:* ${payload.processo || 'N/A'}\n` +
                              `🔊 *Fonte Sonora:* ${payload.fonteSonora}\n` +
                              `_- Mensagem gerada automaticamente pelo sistema de fiscalização._`;

        document.getElementById('successCard').classList.remove('hidden');
      } else {
        alert("Erro ao salvar: " + result.message);
        btn.disabled = false;
        btn.textContent = "Enviar e Gerar WhatsApp";
      }
    } catch (err) {
      alert("Erro na comunicação com a planilha.");
      btn.disabled = false;
      btn.textContent = "Enviar e Gerar WhatsApp";
    }
  });

  document.getElementById('whatsappLink').addEventListener('click', function() {
    navigator.clipboard.writeText(textoMensagemGlobal).catch(err => {
      console.log('Erro ao copiar texto: ', err);
    });
  });

  document.getElementById('btnVoltar').addEventListener('click', function() {
    form.reset();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = false;
    btn.textContent = "Enviar e Gerar WhatsApp";

    document.getElementById('successCard').classList.add('hidden');
    document.getElementById('formCard').classList.remove('hidden');
  });
</script>

</body>
</html>
